<form class="lx-nav-search" role="search" (submit)="onSubmit($event)">
  <label class="lx-sr-only" for="lx-global-search">Search for products, brands and more</label>
  <i class="pi pi-search lx-nav-search__icon" aria-hidden="true"></i>
  <input
    id="lx-global-search"
    class="lx-nav-search__input"
    type="search"
    name="q"
    placeholder="Search for products, brands and more"
    autocomplete="off"
    [ngModel]="query()"
    (ngModelChange)="queryChange.emit($event)"
  />
</form>
