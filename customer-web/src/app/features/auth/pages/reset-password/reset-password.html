<section class="lx-auth-card" aria-labelledby="lx-reset-title">
  <header class="lx-auth-card__header">
    <img src="assets/images/loanex-logo.png" alt="LoanEx" width="44" height="44" />
    <div>
      <h1 id="lx-reset-title">Reset password</h1>
      <p>Choose a new password for your LoanEx account.</p>
    </div>
  </header>

  <form class="lx-auth-card__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="lx-field">
      <label class="lx-label" for="reset-mobile">Mobile</label>
      <input id="reset-mobile" class="lx-input" type="tel" formControlName="mobile" maxlength="10" />
      <app-form-field-error [control]="form.controls.mobile" label="Mobile" />
    </div>

    <div class="lx-field">
      <label class="lx-label" for="reset-otp">OTP</label>
      <input id="reset-otp" class="lx-input" type="text" inputmode="numeric" formControlName="otp" maxlength="6" />
      <app-form-field-error [control]="form.controls.otp" label="OTP" />
    </div>

    <div class="lx-field">
      <label class="lx-label" for="reset-password">New Password</label>
      <div class="lx-auth-card__password">
        <input
          id="reset-password"
          class="lx-input lx-input--password"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="newPassword"
          autocomplete="new-password"
        />
        <button type="button" class="lx-auth-card__eye" (click)="togglePassword()" [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'">
          <i class="pi" [class.pi-eye]="!showPassword()" [class.pi-eye-slash]="showPassword()" aria-hidden="true"></i>
        </button>
      </div>
      <app-form-field-error [control]="form.controls.newPassword" label="New password" />
    </div>

    <div class="lx-field">
      <label class="lx-label" for="reset-confirm">Confirm Password</label>
      <input id="reset-confirm" class="lx-input lx-input--password" type="password" formControlName="confirmPassword" autocomplete="new-password" />
      @if (form.hasError('fieldsMismatch') && form.controls.confirmPassword.touched) {
        <p class="lx-error-text" role="alert">Passwords do not match</p>
      } @else {
        <app-form-field-error [control]="form.controls.confirmPassword" label="Confirm password" />
      }
    </div>

    @if (error(); as err) {
      <p class="lx-error-text" role="alert">{{ err }}</p>
    }

    @if (success(); as msg) {
      <p class="lx-success-text" role="status">{{ msg }}</p>
    }

    <button type="submit" class="lx-btn lx-btn--primary lx-btn--block" [class.is-loading]="loading()" [disabled]="loading()">
      Update Password
    </button>
  </form>

  <p class="lx-auth-card__footer">
    <a routerLink="/auth/login">Back to sign in</a>
  </p>
</section>
