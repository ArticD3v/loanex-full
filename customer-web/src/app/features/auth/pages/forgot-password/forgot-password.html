<section class="lx-auth-card" aria-labelledby="lx-forgot-title">
  <header class="lx-auth-card__header">
    <img src="assets/images/loanex-logo.png" alt="LoanEx" width="44" height="44" />
    <div>
      <h1 id="lx-forgot-title">Forgot password</h1>
      <p>Enter your registered mobile number to receive an OTP.</p>
    </div>
  </header>

  <form class="lx-auth-card__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="lx-field">
      <label class="lx-label" for="forgot-mobile">Mobile</label>
      <input id="forgot-mobile" class="lx-input" type="tel" inputmode="numeric" formControlName="mobile" placeholder="9876543210" maxlength="10" />
      <app-form-field-error [control]="form.controls.mobile" label="Mobile" />
    </div>

    @if (error(); as err) {
      <p class="lx-error-text" role="alert">{{ err }}</p>
    }

    <button type="submit" class="lx-btn lx-btn--primary lx-btn--block" [class.is-loading]="loading()" [disabled]="loading()">
      Send OTP
    </button>
  </form>

  <p class="lx-auth-card__footer">
    Remembered your password?
    <a routerLink="/auth/login">Back to sign in</a>
  </p>
</section>

<app-otp-verification-dialog
  [visible]="otpOpen()"
  [mobile]="form.controls.mobile.value"
  [loading]="loading()"
  [error]="otpError()"
  [length]="6"
  title="Verify OTP"
  (visibleChange)="otpOpen.set($event)"
  (verified)="onOtpVerified($event)"
  (resend)="onResendOtp()"
/>
