services:
  postgres:
    image: postgres:16-alpine
    container_name: loanex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loanex
    ports:
      - '5432:5432'
    volumes:
      - loanex_pg_data:/var/lib/postgresql/data

volumes:
  loanex_pg_data:
